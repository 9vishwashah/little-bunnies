[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all traffic to HTTPS
[[redirects]]
  from = "http://littlebunnies.co.in/*"
  to   = "https://littlebunnies.co.in/:splat"
  status = 301
  force  = true

# Remove www and redirect to apex
[[redirects]]
  from = "https://www.littlebunnies.co.in/*"
  to   = "https://littlebunnies.co.in/:splat"
  status = 301
  force  = true

# Cache static Next.js assets forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache public images for 1 day
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Security headers for ALL pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── SEO: Explicitly allow indexing on all public shop pages ──────────────────
# This overrides any residual X-Robots-Tag: noindex that Clerk dev-mode might
# inject, ensuring Googlebot can index every page.
[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

[[headers]]
  for = "/products"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

[[headers]]
  for = "/products/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

[[headers]]
  for = "/product/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

[[headers]]
  for = "/about"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/contact"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/faq"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/wholesale"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/work-for-us"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/shipping-policy"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/returns"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/exchange-policy"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/privacy-policy"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/terms"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Prevent indexing of private/user routes
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cart"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wishlist"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
